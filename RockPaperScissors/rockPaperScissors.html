<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>

    <main>
        <section id="battlefield">
            <div>
                <img src="assets/img/son-goku.png" alt="">
            </div>
            
            <div id="scoreboard">
                <h2>Points</h2>
                <h3 id="score">0 - 0</h3>
                <h3 id="sonGokuChoice"></h3>
                <h3 id="vegetaChoice"></h3>
            </div>
          
            <div>
                <img src="assets/img/vegeta.png" alt="">
            </div>
            
        </section>

        <section id="icons">
            <div id="rock">
                <img id="rockIcon" src="assets/img/rock.svg" alt="">
            </div>

            <div id="paper">
                <img id="paperIcon" src="assets/img/paper.svg" alt="">
            </div>

            <div id="scissors">
                <img id="scissorsIcon" src="assets/img/scissors.svg" alt="">
            </div>
        </section>

        <section id="restart">
            <button>RESTART GAME</button>
        </section>
    </main>
</body>
</html>
